name: Deploy site to GitHub Pages

on:
  push:
    branches: [ website ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip site
        run: unzip -o PdfSplitter-website.zip

      - name: Add APK if present
        run: |
          if [ -f pdf-splitter.apk ]; then
            mkdir -p PdfSplitterSite/downloads
            cp pdf-splitter.apk PdfSplitterSite/downloads/pdf-splitter.apk
          fi

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: PdfSplitterSite

      - id: deployment
        uses: actions/deploy-pages@v4
